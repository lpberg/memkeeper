<script>
function add_memory() {
	const formData = new FormData();
	formData.append('title', document.getElementById("form_title").value);
	formData.append('desc', document.getElementById("form_desc").value);

	let files = document.querySelector('input[type="file"]').files
	if (files.length > 0) {
        for (let i = 0; i < files.length; i++) {
          formData.append('file'+i, files[i]);
        }
	}

	fetch('/memory/add', {
  		method: 'POST',
  		body: formData
	}).then(response => {
  		if (!response.ok) {throw new Error('Network response was not ok');}
  		return response.json();
	}).then(data => {
		window.location.replace("/");
	}).catch(error => {console.error('There has been a problem with your fetch operation:', error);});
}
</script>

<form class="mt-5" method="post" enctype="multipart/form-data" id="formed">
<label for="form_title" class="form-control w-full max-w-xs">
	Title
	<input type="text" id="form_title" name="fname" class="input input-bordered w-full max-w-xs" required>
</label>
<label for="form_desc" class="form-control my-5">
	Description:
	<textarea cols="80" rows="6"  id="form_desc" class="textarea textarea-bordered"></textarea>
</label>
<input type=file id=file1 name=file1 class="file-input file-input-bordered mb-5 block" multiple>
<input type="button" onclick="add_memory()" id="form_submit" value="Add Memory" class="btn btn-primary btn-lg">
</form>
