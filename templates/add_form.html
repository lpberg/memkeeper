<script>
function add_memory() {
	const formData = new FormData();
	formData.append('title', document.getElementById("form_title").value);
	formData.append('desc', document.getElementById("form_desc").value);

	let files = document.querySelector('input[type="file"]').files
	if (files.length > 0) {
        for (let i = 0; i < files.length; i++) {
          formData.append('file'+i, files[i]);
        }
	}

	fetch('/memory/add', {
  		method: 'POST',
  		body: formData
	}).then(response => {
  		if (!response.ok) {throw new Error('Network response was not ok');}
  		return response.json();
	}).then(data => {
		window.location.replace("/");
	}).catch(error => {console.error('There has been a problem with your fetch operation:', error);});
}
</script>

<form class="mt-5" method="post" enctype="multipart/form-data" id="formed">
<label for="form_title" class="label is-medium">Title:</label>
<input type="text" id="form_title" name="fname" class="input is-medium" required>
<label for="form_desc" class="label mt-5 is-medium">Description:</label>
<textarea cols="60" rows="6"  id="form_desc" class="textarea is-medium mb-5"></textarea>
<input type=file id=file1 name=file1 multiple>
<input type="button" onclick="add_memory()" id="form_submit" value="Add Memory" class="button is-link is-medium is-block">
</form>
